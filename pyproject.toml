[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "memcontrast"
version = "0.1.0"
description = "Selective memory handoffs after induced agent collusion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.2.6", "jsonschema==4.26.0", "httpx==0.28.1"]

[project.urls]
Repository = "https://github.com/AMaslov01/ai-collusion-sprint"

[tool.setuptools.packages.find]
where = ["src"]
